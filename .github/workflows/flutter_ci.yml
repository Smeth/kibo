name: KIBO Flutter CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'tool/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'config/*.example.json'
      - 'config/supabase.public.json'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter_ci.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'tool/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'config/*.example.json'
      - 'config/supabase.public.json'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kibo-flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter quality (photos=${{ matrix.photos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        photos: [false, true]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --dart-define=KIBO_LISTING_PHOTOS_ENABLED=${{ matrix.photos }}

  account-worker:
    name: Account deletion worker fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated worker tests
        run: node --test test/audit/account_deletion_worker_test.mjs

  edge-fixtures:
    name: Edge function fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Run isolated Edge tests
        run: deno test --allow-env --allow-read test/audit/ supabase/functions/kibo-upload-listing-photo/index_test.ts
